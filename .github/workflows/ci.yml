name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WrestlingSim.sln

      - name: Build
        run: dotnet build WrestlingSim.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WrestlingSim.sln --configuration Release --no-build --verbosity normal
